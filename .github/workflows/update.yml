name: update-data
on:
  schedule:
    - cron: "11 */3 * * *"
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    paths: ["scrape.py", ".github/workflows/update.yml"]
permissions: {contents: write}
concurrency: {group: update-data, cancel-in-progress: false}
jobs:
  u:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scrape.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update data"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
